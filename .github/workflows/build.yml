name: Build & Deploy Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List data files
        run: |
          echo "Data files found:"
          ls -la data/ || echo "(thu muc data/ chua co)"

      - name: Build HTML report
        run: python build_report.py

      - name: Encrypt with StatiCrypt
        run: |
          npm install -g staticrypt
          staticrypt index.html -p "${{ secrets.REPORT_PASSWORD }}" --short -d encrypted
          mv encrypted/index.html index.html
          echo "Encrypted index.html generated"

      - name: Show output
        run: |
          echo "Generated files:"
          ls -la index.html
          echo "Size: $(du -h index.html | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
